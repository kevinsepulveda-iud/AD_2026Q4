name: Ejecutar EA3

on:
  push:
    branches:
      - main
    paths:
      - "EA3_comparacion_climatica/**.ipynb"
      - "EA3_comparacion_climatica/datos/**"
      - ".github/workflows/ejecutar-ea3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ejecutar-ea3
  cancel-in-progress: false

jobs:
  ejecutar-notebook:
    runs-on: ubuntu-latest
    env:
      PYTHONWARNINGS: "ignore:IProgress not found"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar el notebook de la EA3
        working-directory: EA3_comparacion_climatica
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=600 \
            EA3_Sepulveda_Kevin.ipynb

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EA3_comparacion_climatica/EA3_Sepulveda_Kevin.ipynb
          if git diff --cached --quiet; then
            echo "No hubo cambios."
            exit 0
          fi
          git commit -m "Ejecución automática EA3: notebook con resultados [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
